<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games App</title>

    <!-- #Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-DQvkBjpPgn7RC31MCQoOeC9TI2kdqa4+BSgNMNj8v77fdC77Kj5zpWFTJaaAoMbC" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YUe2LzesAfftltw+PEaao2tjU/QATaW/rOitAq67e0CT0Zi2VVRL0oC4+gAaeBKu"
        crossorigin="anonymous"></script>

    <!-- # FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- # Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <header>
        <nav class="navbar bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="https://cdn-icons-png.flaticon.com/512/5930/5930147.png" alt="Logo" height="30"
                        class="d-inline-block align-text-top" />
                    Games App Dev
                </a>
            </div>
        </nav>
    </header>

    <main class="container-xl">
        <div class="row">

            <div class="col-12 col-lg-4">
                <h2>FORMULARIO</h2>
            </div>

            <div class="col-12 col-lg-8">
                <h2>JUEGOS</h2>
                <div class="p-3 border border-info-subtle">
                    <div class="row">
                        <div class="col">
                            <label for="name" class="form-label">Buscar</label>
                            <input type="text" class="form-control" id="name" placeholder="Nombre del juego" />
                        </div>
                        <div class="col">
                            <label for="genre" class="form-label">Género</label>
                            <select id="genre" class="form-select">
                                <option selected disabled>Selecciona un género</option>
                                <option value="Action">Acción</option>
                                <option value="Adventure">Aventura</option>
                                <option value="Board">Tablero</option>
                                <option value="Sports">Deportes</option>
                            </select>
                        </div>
                        <div class="col">
                            <label for="genre" class="form-label">Ordenar</label>
                            <div>
                                <button onclick="ordenarPorPrecio('asc')" 
                                        class="btn btn-sm btn-primary" title="Ordenar precio ascendente">
                                    <i class="fa-solid fa-caret-up"></i>
                                </button>
                                <button onclick="ordenarPorPrecio('desc')" class="btn btn-sm btn-primary" title="Ordenar precio descendente">
                                    <i class="fa-solid fa-caret-down"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <table class="table table-dark table-striped">
                    <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Género</th>
                            <th>Price</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>



                    <tbody id="table-body">


                    </tbody>
                </table>

            </div>

        </div>
    </main>

    <footer class="main-footer">
        FOOTER
    </footer>


    <!-- # Leemos nuestro JS -->
    <script src="/js/games.js"></script>
</body>

</html>
